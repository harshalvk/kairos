name: Feature request
description: Propose a new capability or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where Kairos currently falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have one in mind. Sketch the API/behavior if relevant.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including workarounds you're currently using.

  - type: checkboxes
    id: adr
    attributes:
      label: Architectural impact
      options:
        - label: This would likely need an ADR (touches queue semantics, storage schema, or a public API surface)
