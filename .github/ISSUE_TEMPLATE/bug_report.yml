name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps — include relevant code, config, or commands.
      placeholder: |
        1. Run `make docker-up`
        2. Enqueue a job with priority X
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kairos version / commit
      placeholder: v0.3.1 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - queue (internal/queue)
        - worker (internal/worker)
        - store (internal/store)
        - admin API (internal/api)
        - gRPC (internal/grpcserver, pkg/kairosclient)
        - scheduler / cron
        - observability (metrics, tracing, logging)
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Structured log output (JSON), if available.
      render: json
