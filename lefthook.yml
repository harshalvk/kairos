pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: gofmt -l {staged_files}
      fail_text: "Files are not gofmt-formatted. Run `make fmt` and re-stage."

    lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD ./...

    vet:
      glob: "*.go"
      run: go vet ./...

    arch:
      glob: "*.go"
      run: go-arch-lint check

pre-push:
  commands:
    test:
      run: go test ./...
    vuln:
      run: govulncheck ./...
    sec:
      run: gosec ./...
