version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\\/test\\/.*$"

vendors:
  allOtherVendors:
    in: "**"

components:
  job:
    in: internal/job
  metrics:
    in: internal/metrics
  ratelimit:
    in: internal/ratelimit
  circuitbreaker:
    in: internal/circuitbreaker
  leaderelection:
    in: internal/leaderelection
  logging:
    in: internal/logging
  tracing:
    in: internal/tracing
  tenant:
    in: internal/tenant
  queue:
    in: internal/queue
  store:
    in: internal/store
  scheduler:
    in: internal/scheduler
  streamqueue:
    in: internal/streamqueue
  worker:
    in: internal/worker
  api:
    in: internal/api
  grpcserver:
    in: internal/grpcserver
  kairospb:
    in: pkg/kairospb
  kairosclient:
    in: pkg/kairosclient
  cmd:
    in: cmd/**
  examples:
    in: examples/**
  config:
    in: internal/config
  kairos:
    in: pkg/kairos
  webhook:
    in: internal/webhook

deps:
  webhook:
    anyVendorDeps: true
    mayDependOn:
      - job
  job:
    anyVendorDeps: true
  metrics:
    anyVendorDeps: true
  logging:
    anyVendorDeps: true
  tracing:
    anyVendorDeps: true
  leaderelection:
    anyVendorDeps: true
  ratelimit:
    anyVendorDeps: true
  circuitbreaker:
    anyVendorDeps: true
  tenant:
    anyVendorDeps: true
  config:
    anyVendorDeps: true
  queue:
    anyVendorDeps: true
    mayDependOn:
      - job
      - tenant
  store:
    anyVendorDeps: true
    mayDependOn:
      - job
      - tenant
  streamqueue:
    anyVendorDeps: true
    mayDependOn:
      - job
  scheduler:
    anyVendorDeps: true
    mayDependOn:
      - tenant
  worker:
    anyVendorDeps: true
    mayDependOn:
      - job
      - queue
      - store
      - metrics
      - ratelimit
      - circuitbreaker
      - logging
      - tracing
      - tenant
      - webhook
  api:
    anyVendorDeps: true
    mayDependOn:
      - job
      - queue
      - store
      - logging
      - tenant
  grpcserver:
    anyVendorDeps: true
    mayDependOn:
      - job
      - queue
      - logging
      - kairospb
      - tenant
  kairospb:
    anyVendorDeps: true
  kairosclient:
    anyVendorDeps: true
    mayDependOn:
      - kairospb
  kairos:
    anyVendorDeps: true
    mayDependOn:
      - job
      - queue
      - store
      - worker
      - ratelimit
      - circuitbreaker
      - logging
      - tenant
      - webhook
  cmd:
    anyVendorDeps: true
    mayDependOn:
      - job
      - metrics
      - ratelimit
      - circuitbreaker
      - leaderelection
      - logging
      - tracing
      - tenant
      - queue
      - store
      - scheduler
      - streamqueue
      - worker
      - api
      - grpcserver
      - kairospb
      - kairosclient
      - config
      - webhook
  examples:
    anyVendorDeps: true
    mayDependOn:
      - job
      - metrics
      - ratelimit
      - circuitbreaker
      - leaderelection
      - logging
      - tracing
      - tenant
      - queue
      - store
      - scheduler
      - streamqueue
      - worker
      - api
      - grpcserver
      - kairospb
      - kairosclient
      - kairos
      - webhook
